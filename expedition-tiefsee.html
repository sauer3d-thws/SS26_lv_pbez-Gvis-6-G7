<h1 id="projekt%C3%BCbersicht--rahmendaten">Projektübersicht &amp; Rahmendaten</h1>

<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<h2 id="die-aufgabenstellung">Die Aufgabenstellung</h2>
<p>Entwickeln und konzeptionieren Sie in Teamarbeit eine <strong>Mixed-Reality</strong>-Anwendung in <strong>Unreal 5.8</strong>, die den Betrachter auf die Schönheit der weitgehend unbekannten Unterwasserwelt aufmerksam macht. Zielplattform der Anwendung ist die <strong>CAVE</strong> im <strong>MAVEL-Lab</strong> der THWS in Schweinfurt.<br />
Vermitteln Sie das Gefühl der <strong>Dringlichkeit</strong>, dieses unersetzliche Ökosystem zu behüten und zu erforschen, ohne es zu beeinträchtigen.<br />
Befassen Sie sich <strong>intensiv</strong> mit der <strong>Story</strong> und weiterführend mit dem <strong>Thema Tiefsee</strong>.<br />
Ordnen Sie sich dann einem der sieben Teams zu und besprechen Sie im Team die zu bearbeitenden Teilaufgaben.<br />
Erlernen Sie die für Sie erforderlichen Software-Komponenten und Werkzeuge.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="text-80 structural" data-theme="thws-sts" lang="en-US" class="text-80 structural" data-marpit-pagination="14" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--class:text-80 structural;--theme:thws-sts;" data-marpit-pagination-total="133">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<p>Am Ende der Veranstaltung erfolgt eine mediale Live-Präsentation durch die Verfasser*innen sowie eine Ausstellung der Ergebnisse. Abgabe als gemeinsames DIN A1 Hochformat Plakat (gedruckt) und als individuelle Präsentation der eigenen Arbeitsergebnisse.<br />
Mit der Teilnahme am Kurs stimmen Sie einer möglichen Veröffentlichung Ihrer Arbeit durch die Hochschule und das AWI zu. Die im Rahmen der Arbeit entstandenen Werke verbleiben in Ihrem Urheberrecht, die zeitlich und räumlich unbeschränkten Nutzungsrechte zu Werbe- und Veröffentlichungszwecken und Weiterverwendung erhält die THWS, sowie das AWI.</p>
</section>

<h3 id="schl%C3%BCsselstation-whalefall">Schlüsselstation Whalefall</h3>
<p><strong>Was ist ein Whalefall?</strong><br />
Wenn der Kadaver eines großen Wals (z.B. Blau- oder Pottwal) auf den Meeresboden der Tiefsee sinkt, spricht man von einem &quot;Whalefall&quot;. Er bringt schlagartig gigantische Mengen an Nährstoffen in einen ansonsten sehr nahrungsarmen, dunklen Lebensraum.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="48" style="" data-marpit-pagination-total="133" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="49" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--class:structural;--theme:thws-sts;" data-marpit-pagination-total="133" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/blauwal.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="49" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--class:structural;--theme:thws-sts;" data-marpit-pagination-total="133" data-marpit-advanced-background="content">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<p><strong>Bedeutung als Mikro-Ökosystem:</strong><br />
Der Kadaver wird zu einer regelrechten Oase des Lebens, die jahrzehntelang ein hochkomplexes, spezialisiertes Ökosystem aufrechterhält. Ein einziger Wal liefert schätzungsweise so viel Kohlenstoff, wie sonst in 2.000 Jahren auf diese Fläche des Meeresbodens &quot;regnet&quot;.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="49" style="" data-marpit-pagination-total="133" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="133" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/krebstiere.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="50" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="133" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>
<p><strong>Die drei Stadien der Zersetzung:</strong></p>
<ol>
<li><strong>Aasfresser-Stadium (Mobile-scavenger stage):</strong> Haie, Schleimaale und Krebstiere fressen über Monate bis Jahre<br />
hinweg das weiche Gewebe in rasendem Tempo ab.</li>
<li><strong>Anreicherungs-Stadium (Enrichment-opportunist stage):</strong> Würmer und kleine Krebstiere besiedeln die Knochen und das umliegende, extrem nährstoffreiche Sediment, das von den organischen Resten durchtränkt ist.</li>
<li><strong>Sulfophiles Stadium (Sulfophilic stage):</strong> Kann Jahrzehnte andauern. Bakterien zersetzen die Fette im Inneren der<br />
gewaltigen Walknochen. Dabei entsteht Schwefelwasserstoff (ähnlich wie an Schwarzen Rauchern). Dieser dient als Energiequelle für hochspezialisierte chemosynthetische Lebewesen, etwa den Knochenfresser-Wurm (Osedax).<br />
</li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="50" style="" data-marpit-pagination-total="133" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="133" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/chemosysthese.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="51" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="133" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>
<p><strong>Evolutionäre &quot;Trittsteine&quot; (Stepping Stones):</strong><br />
Wissenschaftler vermuten, dass Whalefalls als evolutionäre Trittsteine fungieren, über die sich chemosynthetische Arten (die auch an heißen Quellen und Cold Seeps vorkommen) über weite Distanzen am Meeresboden ausbreiten können.<br />
</p>
</section>

<h3 id="schl%C3%BCsselstation-eisfischnester">Schlüsselstation Eisfischnester</h3>
<p><strong>Sensationelle Entdeckung (AWI-Forschung):</strong><br />
Im Jahr 2021 entdeckten Forscher des Alfred-Wegener-Instituts (AWI) mit dem Forschungsschiff <em>Polarstern</em> im antarktischen Weddellmeer die weltweit größte bekannte Fischbrutkolonie.<br />
</p>

</p>

<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<p><strong>Aufbau der Nester:</strong><br />
Die Fische legen kreisrunde, kiesartige Mulden (ca. 75 cm Durchmesser, 15 cm tief) auf dem Meeresboden an. Jedes bebrütete Nest enthält im Durchschnitt über 1.500 Eier und wird in der Regel von einem erwachsenen Eisfisch aggressiv gegen Raubfische verteidigt.<br />
</p>

<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>
<p><strong>Biologie der Eisfische:</strong></p>
<ul>
<li>Sie haben durchsichtiges Blut (ihnen fehlt das Hämoglobin), was eine Anpassung an das extrem kalte, sauerstoffreiche Wasser ist (Sauerstoff löst sich direkt im Blutplasma).</li>
<li>Frostschutzproteine verhindern, dass ihr Blut bei den Temperaturen unter dem Gefrierpunkt gefriert.</li>
</ul>
</section>

<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<p><strong>Ökologische Bedeutung:</strong><br />
Diese gigantische Ansammlung von Biomasse (geschätzte 60.000 Tonnen) bildet einen Hotspot des Lebens im eisigen Südpolarmeer und dient beispielsweise Weddellrobben als riesiges &quot;All-you-can-eat&quot;-Buffet. Die Entdeckung unterstreicht, wie wenig wir über bestimmte marine Ökosysteme wissen und wie schützenswert sie sind.</p>
</section>

<h3 id="schl%C3%BCsselstation-schwarze-raucher">Schlüsselstation Schwarze Raucher</h3>
<p><strong>Was sind Schwarze Raucher?</strong><br />
Schwarze Raucher sind hydrothermale Quellen, vulkanische Austritte am Meeresboden, meist in Tiefsee-Grabenbruchzonen (z.B. am Mittelatlantischen Rücken in 2.000 bis 3.000 Metern Tiefe).<br />
</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="57" style="" data-marpit-pagination-total="133" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="58" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--class:structural;--theme:thws-sts;" data-marpit-pagination-total="133" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/MARUM_Schwarzer_Raucher.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-class="structural" data-theme="thws-sts" lang="en-US" class="structural" data-marpit-pagination="58" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--class:structural;--theme:thws-sts;" data-marpit-pagination-total="133" data-marpit-advanced-background="content">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>

<p><strong>Geologie und Chemie:</strong><br />
Meerwasser sickert durch Risse im Meeresboden in die Kruste, wird in der Nähe von Magmakammern stark erhitzt (bis über 400 °C) und reichert sich mit Mineralien wie Eisen, Kupfer, Zink, Schwefelwasserstoff und Kohlendioxid an.</p>

<p><strong>Chemosynthese – Die Grundlage:</strong><br />
Da kein Sonnenlicht hinkommt, produzieren spezialisierte Bakterien und Archaeen ihre Energie nicht durch Photosynthese, sondern durch <strong>Chemosynthese</strong>:<br />
Sie oxidieren Schwefelwasserstoff (H₂S) aus den Quellen und wandeln chemische Energie in organische Substanz um.<br />
</p>

<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>
<h2 id="pr%C3%BCfungs--und-bewertungskriterien">Prüfungs- und Bewertungskriterien</h2>
<p>Das Projekt wird über die Software Confluence administriert und protokolliert.<br />
<a href="https://vr-lab.atlassian.net/wiki/spaces/PG/pages/3016785921/Tiefsee-2026-27">https://vr-lab.atlassian.net/wiki/spaces/PG/pages/3016785921/Tiefsee-2026-27</a></p>
<p>Jeder Kursteilnehmende hat ein Protokoll über die eigene Arbeitsleistung zu erstellen. Neben den tatsächlich erstellten Artefakten<br />
fließen die protokollierten Leistungen in die Benotung ein.<br />
Im Confluence-System ist eine Seitenstruktur vorhanden, die für das Protokoll genutzt werden kann.<br />
</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="83" style="" data-marpit-pagination-total="133" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;" data-marpit-pagination-total="133">
<header><strong>Expedition Tiefsee</strong> <br /> FOL Stefan Sauer</header>
<h3 id="endpr%C3%A4sentationen">Endpräsentationen</h3>
<p>Neben der Präsentation der Endanwendung ist von jedem Teilnehmenden ein Kurzreferat über 5 Minuten über die eigene Arbeitsleistung zu halten.<br />
Als Basis der Präsentation dient das Confluence-Protokoll.<br />
Das Referat ist als pdf abzugeben und geht in die Bewertung ein.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-header="**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer" data-theme="thws-sts" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--header:**Expedition Tiefsee** &lt;br&gt; FOL Stefan Sauer;--theme:thws-sts;" data-marpit-pagination-total="133">

<h1 id="interdisziplin%C3%A4re-teamstruktur--aufgabenverteilung">Interdisziplinäre Teamstruktur &amp; Aufgabenverteilung</h1>

<p>Unterwasser-Atmosphäre (Shader):</p>
<ul>
<li>Entwicklung des globalen Nebel-Shaders (Exponential Fog), der sich fließend von Cyan zu Tiefblau und schließlich zu absolutem Schwarz verfärbt.</li>
<li>Wasser-Splatter- und Schlieren-Shader für die Bereiche der CAVE-Wände, die hinter den physischen Bullaugen liegen.</li>
<li>Volumetrische Kegellichter für die virtuellen Scheinwerfer des Bootes (reagiert auf den Helligkeitswert des physischen Dimmers).</li>
</ul>
</section>
