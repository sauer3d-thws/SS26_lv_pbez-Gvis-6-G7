name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare build directory
        run: |
          mkdir -p public
          cp -r img public/
          cp -r themes public/
          if [ -d data ]; then cp -r data public/; fi
          if [ -d exkursion ]; then cp -r exkursion public/; fi

      - name: Build HTML & PDF with Marp CLI
        run: |
          npx @marp-team/marp-cli@latest expedition-tiefsee.md --theme-set themes/ --html --allow-local-files -o public/index.html
          npx @marp-team/marp-cli@latest expedition-tiefsee.md --theme-set themes/ --pdf --allow-local-files -o public/expedition-tiefsee.pdf

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
