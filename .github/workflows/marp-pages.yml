name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare public directory
        run: |
          mkdir -p public
          touch public/.nojekyll
          cp -r img public/ || true
          cp -r themes public/ || true
          if [ -d data ]; then cp -r data public/; fi
          if [ -d exkursion ]; then cp -r exkursion public/; fi
          if [ -f expedition-tiefsee.pdf ]; then cp expedition-tiefsee.pdf public/; fi
          if [ -f expedition-tiefsee.html ]; then cp expedition-tiefsee.html public/; fi

      - name: Build HTML with Marp CLI
        run: |
          npx --yes @marp-team/marp-cli expedition-tiefsee.md --theme-set themes/ --html --allow-local-files -o public/index.html
          cp public/index.html public/expedition-tiefsee.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
